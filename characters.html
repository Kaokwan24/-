<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คนในเมือง</title><link rel="stylesheet" href="style.css"></head><body><div id="status"></div><nav id="nav"></nav><main><h1>คนที่จำบางอย่างแทนคุณ</h1><div class="cards"><article class="paper"><b>ป้าเดือน</b><p>เจ้าของร้านหนังสือ เธอจำชื่อคนได้แม่นกว่าจำราคาหนังสือ</p></article><article class="paper"><b>มิก</b><p>เด็กส่งหนังสือที่ชอบขี่จักรยานสีแดง เขามักมาถึงก่อนข่าวเสมอ</p></article><article class="paper"><b>หมึก</b><p>แมวดำประจำร้านซักผ้า ไม่เคยพูด แต่เหมือนรู้ว่าคุณเคยมาแล้ว</p></article><article class="paper"><b>ชายเฝ้าชานชาลา</b><p>นั่งที่เดิมทุกเย็น และไม่เคยถามว่าคุณจะไปไหน</p></article></div></main><script type="module">import{shell}from"./js/ui.js";shell("คนในเมือง")</script></body></html>
