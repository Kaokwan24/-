<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ห้องของคุณ</title><link rel="stylesheet" href="style.css"></head><body><div id="status"></div><nav id="nav"></nav><main><section class="roomscene"><div class="window">☂ ☂ ☂<br>ฝนตก</div><div class="desk">โต๊ะไม้<br><button id="cassette">▣ เครื่องเล่นเทป</button><button id="letter">✉ กล่องจดหมาย</button></div><div class="bed">เตียงที่ยังไม่ได้เก็บ</div></section><article class="paper"><h2>คำถามของวันนี้</h2><p>ถ้าคุณสามารถกลับไปนั่งในวันหนึ่งได้ โดยไม่มีสิทธิ์เปลี่ยนอะไรเลย คุณจะเลือกวันไหน?</p><textarea id="note" placeholder="เขียนไว้ก่อนก็ได้ ไม่มีใครต้องอ่าน"></textarea><button id="save">เก็บไว้ในสมุด</button></article></main><script type="module">import{shell}from"./js/ui.js";import{load,remember,patch,journal}from"./js/state.js";import{dialog,toast}from"./js/ui.js";shell("ห้อง");cassette.onclick=()=>{patch({flags:{...load().flags,cassette:true}});remember("เสียงของตัวเองในเทป");dialog("เทปม้วนเก่า","เสียงของคุณดังเบา ๆ: “ถ้าได้ยินอันนี้ แปลว่าเรายังไม่ได้ลืมทั้งหมด”");};letter.onclick=()=>dialog("กล่องจดหมาย","ข้างในว่างเปล่า แต่ก้นกล่องมีรอยปากกาว่า “พรุ่งนี้ อย่าขึ้นรถไฟเที่ยวแรก”");save.onclick=()=>{journal(note.value);note.value="";toast("เก็บความคิดนี้ไว้แล้ว")}</script></body></html>
