<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ห้องของคุณ</title><link rel="stylesheet" href="css/pixel.css"></head><body><div class="wrap"><header class="top"><div><div class="brand">ห้อง 204</div><div class="sub">สถานที่ที่ของเก่าชอบทำเหมือนมันยังจำเราได้</div></div><div class="hud" data-hud></div></header><main><div class="card"><h2>โต๊ะไม้</h2><p>บนโต๊ะมีเทปคาสเซ็ต สมุดดำ เหรียญเก่า และกระดาษที่เขียนไว้ว่า “อย่าเปิดตอนที่ยังไม่พร้อม”</p><div class="actions"><button id="cassette">เปิดเทป</button><button id="coin">ดูเหรียญ</button><button id="letter">อ่านกระดาษ</button></div></div><div class="dialog"><div class="who">คำถามของวันนี้</div><p id="question">ถ้าคุณจำเรื่องหนึ่งได้ในคืนนี้ คุณอยากให้มันเป็นเรื่องอะไร?</p><div class="actions"><button id="change">เปลี่ยนคำถาม</button><button id="sleep">นอน</button></div></div><div class="card"><h2>เขียนไว้ก่อน</h2><textarea id="journal" placeholder="ไม่ต้องเขียนให้สวย แค่เขียนให้เป็นเสียงของคุณ..."></textarea><div class="actions"><button id="save">เก็บลงสมุด</button><a class="btn" href="journal2.html">อ่านบันทึกเก่า</a></div></div><div class="actions"><a class="btn" href="town.html">กลับเมือง</a></div></main><div id="out"></div></div><script type="module">import{hud,action,toast,saveJournal,nextDay,go}from"./js/game.js";import{load,save,addItem,remember}from"./js/state.js";hud();const q=["ถ้าคุณจำเรื่องหนึ่งได้ในคืนนี้ คุณอยากให้มันเป็นเรื่องอะไร?","มีใครบางคนที่คุณยังไม่ได้บอกลาอยู่หรือเปล่า?","ถ้าความทรงจำมีเสียง วันนี้มันจะเปิดเพลงอะไร?","คุณคิดว่าตัวเองกลับมาที่นี่ทำไม?"];document.querySelector("#change").onclick=()=>{const s=load();const i=(s.flags.q||0)+1;s.flags.q=i%q.length;save(s);document.querySelector("#question").textContent=q[s.flags.q];hud()};document.querySelector("#cassette").onclick=()=>action(()=>{addItem("เสียงจากเทป");remember("เสียงของตัวเองพูดว่า: ถ้าได้ยินอันนี้ แปลว่าเรายังไม่ได้ลืมทั้งหมด");toast("เสียงของคุณดังออกมาเบามาก: “ถ้าได้ยินอันนี้ แปลว่าเรายังไม่ได้ลืมทั้งหมด”")});document.querySelector("#coin").onclick=()=>action(()=>{remember("เหรียญเก่าที่มีวันที่ 17");toast("ด้านหลังเหรียญมีเลข 17 ขีดไว้สามครั้ง")});document.querySelector("#letter").onclick=()=>action(()=>{remember("กระดาษใต้ประตู");toast("“ถ้าวันนี้เจอคนที่คิดถึง อย่าเพิ่งบอกเขาว่าคิดถึง”")});document.querySelector("#save").onclick=saveJournal;document.querySelector("#sleep").onclick=()=>{nextDay();toast("คุณหลับไปก่อนที่เมืองจะตอบคำถาม");setTimeout(()=>go("town.html"),800)};</script></body></html>
