<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>เมืองปลายราง</title><link rel='stylesheet' href='style.css'></head><body><main><small>เมืองปลายราง / 07:18 / ฝนปรอย</small><h1>ฝนตกเหมือนคนกำลังลังเล</h1><p>ถนนยังเปียกอยู่ ร้านค้าบางร้านยังไม่เปิดไฟ มีจักรยานคันหนึ่งพิงเสาโทรศัพท์ ทั้งที่ไม่มีเจ้าของอยู่แถวนั้น</p><p>คุณรู้จักเมืองนี้พอจะเดาได้ว่าใครเป็นเจ้าของ แต่ยังไม่รู้ว่าจะเรียกสิ่งนั้นว่า “รู้จัก” ได้หรือเปล่า</p><hr><button onclick='bookstore()'>ร้านหนังสือเดือน</button> <button onclick='post()'>ไปรษณีย์</button> <button onclick='station()'>สถานีปลายราง</button><section id='story'></section></main><script>const story=document.getElementById('story');function bookstore(){story.innerHTML='<h2>ร้านหนังสือเดือน</h2><p>ป้าเดือนเงยหน้าจากหนังสือ “วันนี้ไม่ต้องซื้อก็ได้ บางทีคนเราก็เข้าร้านหนังสือเพราะอยากอยู่ในที่ที่ไม่มีใครถามว่าเป็นอะไร”</p>'}function post(){story.innerHTML='<h2>ช่องที่ 13</h2><p>มีซองหนึ่งวางอยู่ในช่องของคุณ ทั้งที่ชื่อผู้รับถูกเขียนด้วยลายมือของคุณเอง</p><p>ถึงคนที่กำลังอ่านข้อความนี้ — ไม่ต้องรีบตอบ ฉันไม่ได้เขียนมาเพื่อถามอะไร</p>'}function station(){story.innerHTML='<h2>สถานีปลายราง</h2><p>ชายเฝ้าชานชาลานั่งอยู่ตรงเดิม “รถไฟไม่เคยถามหรอกว่าจะไปไหน มันแค่จอด แล้วคนที่มีเหตุผลพอก็ขึ้นไป คนที่ยังไม่มี…ก็นั่งรอ”</p>'}</script></body></html>
