<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ห้องสมุด</title><link rel="stylesheet" href="css/pixel.css"></head><body><div class="wrap"><header class="top"><div><div class="brand">ห้องสมุดประชาชน</div><div class="sub">ที่นี่เงียบจนคุณได้ยินเสียงตัวเองจำอะไรบางอย่าง</div></div><div class="hud" data-hud></div></header><main><div class="grid"><article class="card"><h2>ชั้น 17</h2><p>หนังสือทุกเล่มมีเลขเรียงตามปี แต่ชั้นนี้ไม่มีปีไหนตรงกับปฏิทินของเมือง</p><button id="read">หยิบเล่มหนึ่ง</button></article><article class="card"><h2>โต๊ะริมหน้าต่าง</h2><p>มีรอยดินสอเขียนว่า “อย่าพยายามจำทั้งหมด จำแค่สิ่งที่คุณพร้อมจะรับกลับมา”</p><button id="note">จดข้อความนี้</button></article></div><div class="actions"><a class="btn" href="town.html">กลับเมือง</a></div></main></div><script type="module">import{hud,toast}from"./js/game.js";import{remember,relate}from"./js/state.js";hud();document.querySelector("#read").onclick=()=>{remember("หนังสือหมายเลข 17");relate("month",1);toast("หน้า 17 มีชื่อของคุณเขียนไว้ แต่ถูกขีดทับด้วยหมึกดำ")};document.querySelector("#note").onclick=()=>{remember("ประโยคจากห้องสมุด");toast("เก็บประโยคนั้นไว้ในความทรงจำแล้ว")};</script></body></html>
