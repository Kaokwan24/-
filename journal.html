<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมุดบันทึก</title><link rel="stylesheet" href="style.css"></head><body><div id="status"></div><nav id="nav"></nav><main><h1>สมุดที่ไม่รีบจำ</h1><p class="lead">บางเรื่องไม่ได้หายไปเพราะเราลืม มันแค่ย้ายไปอยู่ในที่ที่เราไม่ค่อยเปิดดู</p><div id="entries"></div></main><script type="module">import{shell}from"./js/ui.js";import{load}from"./js/state.js";shell("สมุด");const s=load();entries.innerHTML=s.journal.length?s.journal.map(x=>"<article class='paper'><small>วันที่ "+x.day+" · "+x.time+"</small><p>"+x.text.replaceAll("<","&lt;")+"</p></article>").join(""):"<article class='paper'>ยังไม่มีอะไรเขียนไว้ เมืองไม่ว่าอะไร</article>"</script></body></html>
