<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมุดของคุณ</title><link rel="stylesheet" href="css/pixel.css"></head><body><div class="wrap"><header class="top"><div><div class="brand">สมุดปกดำ</div><div class="sub">บางอย่างต้องถูกเขียนลงไป ก่อนจะยอมกลายเป็นความทรงจำ</div></div><div class="hud" data-hud></div></header><main><div class="card"><textarea id="entry" placeholder="วันนี้ฉันสังเกตว่า..."></textarea><div class="actions"><button id="save">เขียนลงสมุด</button><a class="btn" href="town.html">กลับเมือง</a></div></div><div class="list" id="list"></div></main></div><script type="module">import{hud}from"./js/game.js";import{load,journal}from"./js/state.js";hud();const list=document.querySelector("#list"),esc=x=>x.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])),render=()=>{const s=load();list.innerHTML=s.journal.length?s.journal.map(x=>'<article class="card"><div class="sub">วันที่ '+x.day+' / '+x.time+'</div><p>'+esc(x.text)+'</p></article>').join(""):'<div class="note">ยังไม่มีข้อความ เมืองยังเงียบอยู่</div>'};document.querySelector("#save").onclick=()=>{const e=document.querySelector("#entry");if(e.value.trim()){journal(e.value);e.value="";render();hud()}};render();</script></body></html>
