<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>โรงหนังดาวเหนือ</title><link rel="stylesheet" href="css/pixel.css"></head><body><div class="wrap"><header class="top"><div><div class="brand">โรงหนังดาวเหนือ</div><div class="sub">รอบ 19:40 / หนังเรื่องเดิมที่ไม่มีใครจำตอนจบได้</div></div><div class="hud" data-hud></div></header><main><div class="card"><h2>ที่นั่ง E17</h2><p>เบาะตัวหนึ่งมีรอยปากกาขีดเป็นรูปดาว คุณนั่งลงแล้วพบตั๋วเก่าอยู่ใต้ที่นั่ง</p><div class="actions"><button id="watch">ดูหนัง</button><button id="ticket">หยิบตั๋ว</button></div></div><div class="dialog">ก่อนหนังเริ่ม ไฟทั้งโรงดับลงครู่หนึ่ง และคุณรู้สึกว่าเคยเห็นฉากนี้มาแล้ว</div><div class="actions"><a class="btn" href="town.html">กลับเมือง</a></div></main></div><script type="module">import{hud,toast}from"./js/game.js";import{remember,relate}from"./js/state.js";hud();document.querySelector("#watch").onclick=()=>{relate("mick",1);toast("ในฉากสุดท้าย ตัวละครคนหนึ่งยืนอยู่หน้าห้อง 204");remember("ฉากในหนังที่คุ้นอย่างประหลาด")};document.querySelector("#ticket").onclick=()=>{remember("ตั๋วหนัง E17");toast("ด้านหลังตั๋วเขียนว่า “อย่าลืมว่าเธอเป็นคนเลือกกลับมา”")};</script></body></html>
