<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>เมืองปลายราง — เดี๋ยวก็รู้</title><link rel='stylesheet' href='style.css'></head><body><main><small>เมืองปลายราง / วันที่ 1 / ฝนปรอย</small><h1>เมืองนี้ไม่ค่อยตอบคำถามตรง ๆ</h1><p>เช้านี้คุณพบกระดาษแผ่นหนึ่งเสียบอยู่ใต้ประตู ไม่เขียนชื่อผู้ส่ง มีเพียงประโยคเดียว:</p><blockquote>“ถ้าวันนี้บังเอิญเจอคนที่คุณคิดถึง อย่าเพิ่งบอกเขาว่าคุณคิดถึง”</blockquote><div><button onclick='room()'>กลับห้อง</button><button onclick='month()'>ร้านหนังสือเดือน</button><button onclick='mick()'>ตามจักรยานสีแดง</button><button onclick='station()'>ไปสถานี</button></div><section id='scene'></section><hr><h2>สมุด</h2><textarea id='note' placeholder='วันนี้ฉันกำลังคิดถึง...'></textarea><button onclick='saveNote()'>เก็บไว้ในสมุด</button><p id='saved'></p></main><script>const s=document.getElementById('scene');const saved=document.getElementById('saved');function room(){s.innerHTML='<h2>ห้องของคุณ</h2><p>นาฬิกาเดินช้ากว่าความจริงเจ็ดนาที บนโต๊ะมีเทปคาสเซ็ตที่คุณจำไม่ได้ว่าเคยซื้อมา เมื่อพลิกดูด้านหลัง มีลายมือเขียนว่า “อย่าเปิดตอนที่ยังไม่พร้อม”</p><button onclick="openTape()">เปิดเทป</button>'}function openTape(){s.innerHTML+='<p>เสียงเทปเริ่มด้วยความเงียบ ก่อนมีเสียงคนหัวเราะไกล ๆ แล้วเสียงของคุณเองพูดว่า “ถ้าได้ยินอันนี้ แปลว่าเรายังไม่ได้ลืมทั้งหมด”</p>'}function month(){s.innerHTML='<h2>ร้านหนังสือเดือน</h2><p>ป้าเดือนกำลังติดป้ายลดราคาหนังสือที่ไม่มีใครซื้อ เธอไม่ถามว่าคุณมาทำไม แค่เลื่อนเก้าอี้ให้ตัวหนึ่ง</p><p>“นั่งก่อนสิ บางวันการมาร้านหนังสือก็ไม่ได้แปลว่าจะต้องอ่านอะไร”</p><button onclick="talkMonth()">นั่งลง</button>'}function talkMonth(){s.innerHTML+='<p>ป้าเดือนเงียบไปพักหนึ่งแล้วพูดว่า “เมื่อวานมีคนมาถามหาหนังสือเล่มหนึ่ง หนังสือชื่อเดียวกับชื่อที่คุณเคยใช้ตอนเด็ก ๆ”</p>'}function mick(){s.innerHTML='<h2>จักรยานสีแดง</h2><p>จักรยานพาคุณเลี้ยวเข้าซอยหลังโรงหนัง มิกยืนอยู่ข้างตู้โทรศัพท์ มือหนึ่งถือจดหมาย อีกมือกำเหรียญเก่า</p><p>“อย่าถามว่าจดหมายของใคร” เขาพูด “ถ้ารู้เร็วเกินไป เรื่องมันจะธรรมดา”</p>'}function station(){s.innerHTML='<h2>สถานีปลายราง</h2><p>ป้ายประกาศขึ้นชื่อเมืองที่ไม่มีอยู่ในแผนที่ คุณหยิบตั๋วจากกระเป๋า แล้วพบว่าบนตั๋วมีวันที่ของวันพรุ่งนี้</p><button onclick="waitTrain()">รอรถไฟ</button>'}function waitTrain(){s.innerHTML+='<p>รถไฟไม่มา แต่มีผู้หญิงคนหนึ่งลงมาจากชานชาลาที่ว่างเปล่า เธอมองคุณเหมือนจำได้ แล้วพูดว่า “ในที่สุดก็กลับมา”</p>'}function saveNote(){const n=document.getElementById('note').value.trim();if(n){localStorage.setItem('journal',n);saved.textContent='เก็บไว้แล้ว — บางอย่างไม่จำเป็นต้องถูกอ่านทันที'}} </script></body></html>
