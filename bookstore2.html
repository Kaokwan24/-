<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ร้านหนังสือเดือน</title><link rel="stylesheet" href="style.css"><body><main><h1>ร้านหนังสือเดือน</h1><p>กลิ่นกระดาษเก่ากับฝนเข้ากันอย่างประหลาด</p><h2>ป้าเดือน</h2><p>“วันนี้ไม่ต้องซื้อก็ได้ บางทีคนเราก็เข้าร้านหนังสือเพราะอยากอยู่ในที่ที่ไม่มีใครถามว่าเป็นอะไร”</p><p>บนชั้นมีหนังสือสีเขียวเปิดค้างอยู่ที่หน้า 47 ลายมือข้างในเหมือนลายมือของคุณ</p><button onclick="alert('บางเรื่องไม่ได้หายไปเพราะเราลืม มันแค่ย้ายไปอยู่ในที่ที่เราไม่ค่อยเปิดดู')">อ่านหน้า 47</button><p><a href="town2.html">กลับเมือง</a></p></main></body></html>
